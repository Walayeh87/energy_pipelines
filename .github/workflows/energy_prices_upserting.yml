name: Energy Prices Upsertion

on:
  schedule:
    # "min h day month year", "*" means every occurrence. The time is in UTC.
    - cron: "47 15 * * *"

  # Allow manual triggering from GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      PYTHONPATH: ${{ github.workspace }}/src


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Energy Price Pipeline
        run: |
          python src/energy_pipelines/core/pipelines/energy_prices_pipeline.py
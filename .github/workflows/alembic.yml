name: Alembic

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  alembic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energy_pipelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d energy_pipelines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/energy_pipelines
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

#      - name: Check model and migration consistency
#        run: alembic check

name: Temperature Schedule Upsertion

on:
  pull_request:
  push:
    branches:
      - main

  schedule:
    # "min h day month year", "*" means every occurrence. The time is in UTC.
    - cron: "17 20 * * *"

  # Allows manual triggering from GitHub.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    env:
#      ENV: dev
      DB_URL: ${{ secrets.DB_URL }}
#      DB_NAME: ${{ secrets.DB_NAME }}

      PYTHONPATH: ${{ github.workspace }}
#      LOG_DIR: ${{ github.workspace }}/logs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Temperature Schedule Pipeline
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/energy_pipelines/core/pipelines/temp_schedule_pipeline.py